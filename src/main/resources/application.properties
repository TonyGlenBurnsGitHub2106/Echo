# Echo (Story 5653). Everything machine-specific -- the database, the keys, the folders -- lives in
# application-local.properties next to this file (git-ignored, written by scripts\Install-Echo.ps1).
spring.application.name=Echo
spring.config.import=optional:application-local.properties,optional:file:./config/application-local.properties

# Port and address. 127.0.0.1 means only this computer can open Echo -- the right default on a
# work machine. Set echo.bind=0.0.0.0 in application-local.properties to open it to the network.
server.port=${echo.port:8770}
server.address=${echo.bind:127.0.0.1}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=60MB

echo.jwt.access-minutes=15
echo.jwt.refresh-days=30

# Minutes of no activity before a browser is signed out. 0 = never (Leonardo's computer default).
echo.session.inactivity-minutes=0

# The address an agent (Rex) is told to use in its brief. Set it when Echo is reached by another name.
echo.public.url=http://localhost:${server.port}

# Where solution files are kept. Relative paths are taken from the folder Echo runs in.
echo.files.path=EchoFiles

# What Echo writes about itself, kept beside it (logs\ is git-ignored).
logging.file.name=logs/echo.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14

# Echo signs people in itself (AuthController); Spring's stand-in user with a printed password is not wanted.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
