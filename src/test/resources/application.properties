# Story 5653: the test copy of application.properties. It shadows the real one on the test classpath,
# so a test never reads config\application-local.properties (the real database and keys) and never
# writes to logs\. Nothing here is a real secret.
spring.application.name=Echo
spring.config.import=
server.port=0
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=60MB
echo.jwt.secret=test-secret-test-secret-test-secret-0123456789
echo.jwt.access-minutes=15
echo.jwt.refresh-days=30
echo.service.key=test-service-key
echo.session.inactivity-minutes=0
echo.public.url=http://localhost:8770
echo.files.path=target/test-files
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
